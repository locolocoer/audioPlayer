appId: com.feiYuMusic.app
productName: FeiYu Music
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*.{md,ts,map}"
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
win:
  icon: resources/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: FeiYu-Music-Setup-${version}.${ext}
mac:
  icon: resources/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.music
  artifactName: FeiYu-Music-${version}-${arch}.${ext}
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  category: Audio
  maintainer: locolocoer
  artifactName: feiyu-music-${version}-${arch}.${ext}
publish:
  provider: github
  owner: locolocoer
  repo: audioPlayer
  releaseType: release