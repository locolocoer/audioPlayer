name: Build Installers

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (typecheck + vitest + build + e2e)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # E2E 用应用自带 Electron，无需下载 Playwright 浏览器
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run check (tsc + vitest + build)
        run: npm run check

      - name: Install Linux display dependencies (Electron E2E)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          # Playwright 按发行版（含 Ubuntu 24.04 的 t64 包名）安装 Chromium/Electron 所需库
          npx playwright install-deps chromium

      - name: Run E2E smoke (xvfb)
        run: xvfb-run -a npm run test:e2e

  build:
    name: Build ${{ matrix.name }}
    # 仅 tag（发版）/ PR / 手动触发时打包；push main 只跑 test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            ffmpeg_url: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            ffmpeg_archive: zip
            ffmpeg_out: resources/ffmpeg.exe
          - name: macos
            os: macos-latest
            ffmpeg_url: https://evermeet.cx/ffmpeg/getrelease/zip
            ffmpeg_archive: zip
            ffmpeg_out: resources/ffmpeg
          - name: linux
            os: ubuntu-latest
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            ffmpeg_url_backup: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            ffmpeg_archive: tarxz
            ffmpeg_out: resources/ffmpeg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Bundle platform ffmpeg
        shell: bash
        run: |
          set -e
          if [ -f "${{ matrix.ffmpeg_out }}" ]; then
            echo "ffmpeg already bundled"
          else
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            download() {
              curl -sSLf --retry 3 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/ffmpeg.pkg" "$1"
            }
            if ! download "${{ matrix.ffmpeg_url }}"; then
              if [ -n "${{ matrix.ffmpeg_url_backup }}" ]; then
                echo "primary ffmpeg source failed, trying backup"
                download "${{ matrix.ffmpeg_url_backup }}"
              else
                exit 1
              fi
            fi
            if [ "${{ matrix.ffmpeg_archive }}" = "zip" ]; then
              unzip -q -o "$RUNNER_TEMP/ffmpeg.pkg" -d "$RUNNER_TEMP/ffmpeg"
            else
              tar -xf "$RUNNER_TEMP/ffmpeg.pkg" -C "$RUNNER_TEMP/ffmpeg"
            fi
            BIN="$(find "$RUNNER_TEMP/ffmpeg" -type f \( -name 'ffmpeg' -o -name 'ffmpeg.exe' \) | head -n 1)"
            if [ -z "$BIN" ]; then
              echo "::error::ffmpeg binary not found in archive"
              exit 1
            fi
            cp "$BIN" "${{ matrix.ffmpeg_out }}"
            chmod +x "${{ matrix.ffmpeg_out }}" || true
          fi
          ls -la resources/

      - name: Build
        run: npm run build

      - name: Package installer
        run: npm run package -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: artifacts/**
          generate_release_notes: true

      - name: Upload to Aliyun OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          curl -sL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -o ossutil
          chmod +x ossutil
          ./ossutil config -e oss-cn-beijing.aliyuncs.com -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"
          # 按版本建立二级目录，latest*.yml 保留在根目录作为稳定的更新指针
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "artifacts/v${VERSION}"
          for f in artifacts/*; do
            [ -d "$f" ] && continue
            case "$(basename "$f")" in
              latest*.yml) ;;
              *) mv "$f" "artifacts/v${VERSION}/" ;;
            esac
          done
          # 将 feed 文件里的安装包路径改写为 v${VERSION}/ 前缀
          for yml in artifacts/latest*.yml; do
            [ -f "$yml" ] || continue
            sed -i -E "s#(url|path): #\1: v${VERSION}/#" "$yml"
          done
          ./ossutil cp -rf artifacts/ oss://frymusic/
