name: Build EXE Installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure ffmpeg.exe bundled
        shell: bash
        run: |
          if [ ! -f resources/ffmpeg.exe ]; then
            curl -sL -o "$RUNNER_TEMP/ffmpeg.zip" https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            unzip -q -o "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg"
            FFMPEG_BIN="$(find "$RUNNER_TEMP/ffmpeg" -path '*/bin/ffmpeg.exe' | head -n 1)"
            if [ -n "$FFMPEG_BIN" ]; then
              cp "$FFMPEG_BIN" resources/ffmpeg.exe
            fi
          fi
          if [ ! -f resources/ffmpeg.exe ]; then
            echo "::error::FFmpeg 下载失败，resources/ffmpeg.exe 缺失"
            exit 1
          fi
          ls -la resources/ffmpeg.exe

      - name: Build
        run: npm run build

      - name: Package EXE installer
        run: npm run package -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeiYu-Music-Setup-${{ github.sha }}
          path: dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
