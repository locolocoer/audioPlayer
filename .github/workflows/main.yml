name: Build Installers

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            ffmpeg_url: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            ffmpeg_archive: zip
            ffmpeg_out: resources/ffmpeg.exe
          - name: macos
            os: macos-13
            ffmpeg_url: https://evermeet.cx/ffmpeg/getrelease/zip
            ffmpeg_archive: zip
            ffmpeg_out: resources/ffmpeg
          - name: linux
            os: ubuntu-latest
            ffmpeg_url: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            ffmpeg_archive: tarxz
            ffmpeg_out: resources/ffmpeg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Bundle platform ffmpeg
        shell: bash
        run: |
          set -e
          if [ -f "${{ matrix.ffmpeg_out }}" ]; then
            echo "ffmpeg already bundled"
          else
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            curl -sL -o "$RUNNER_TEMP/ffmpeg.pkg" "${{ matrix.ffmpeg_url }}"
            if [ "${{ matrix.ffmpeg_archive }}" = "zip" ]; then
              unzip -q -o "$RUNNER_TEMP/ffmpeg.pkg" -d "$RUNNER_TEMP/ffmpeg"
            else
              tar -xf "$RUNNER_TEMP/ffmpeg.pkg" -C "$RUNNER_TEMP/ffmpeg"
            fi
            BIN="$(find "$RUNNER_TEMP/ffmpeg" -type f \( -name 'ffmpeg' -o -name 'ffmpeg.exe' \) | head -n 1)"
            if [ -z "$BIN" ]; then
              echo "::error::ffmpeg binary not found in archive"
              exit 1
            fi
            cp "$BIN" "${{ matrix.ffmpeg_out }}"
            chmod +x "${{ matrix.ffmpeg_out }}" || true
          fi
          ls -la resources/

      - name: Build
        run: npm run build

      - name: Package installer
        run: npm run package -- --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
